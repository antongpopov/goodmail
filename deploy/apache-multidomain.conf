# One goodmail (Node on 127.0.0.1:3077) reachable as goodmail.<domain> for every mail domain.
# Adding a domain = a DNS record for goodmail.<domain>, one more ServerAlias, and the certificate extended:
#   certbot certonly --webroot -w /var/www/goodmail/dist --cert-name goodmail --expand \
#           -d goodmail.example.com -d goodmail.example.org -d goodmail.example.net
# (the http vhost keeps /.well-known/acme-challenge/ reachable for that).

<VirtualHost *:80>
    ServerName goodmail.example.com
    ServerAlias goodmail.example.org goodmail.example.net
    DocumentRoot /var/www/goodmail/dist
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName goodmail.example.com
    ServerAlias goodmail.example.org goodmail.example.net
    DocumentRoot /var/www/goodmail/dist

    # goodmail serves both the app and /api; the Host header must reach it (login by host, passkeys)
    ProxyPreserveHost On
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        / http://127.0.0.1:3077/ timeout=120
    ProxyPassReverse / http://127.0.0.1:3077/
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 52428800

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/goodmail/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/goodmail/privkey.pem
</VirtualHost>

# --- Friendly page while goodmail restarts (502/503/504 from the proxy) ---------------------------------------------
# Put the three lines below INSIDE the <VirtualHost *:443> block, before the general "ProxyPass / ..." line, and copy
# unavailable.html to /var/www/<site>/errors/ (outside dist/, so a deploy does not remove it).
#   Alias /goodmail-errors/ /var/www/<site>/errors/
#   ProxyPass /goodmail-errors/ !
#   ErrorDocument 502 /goodmail-errors/unavailable.html
#   ErrorDocument 503 /goodmail-errors/unavailable.html
#   ErrorDocument 504 /goodmail-errors/unavailable.html
# and allow the folder:  <Directory /var/www/<site>/errors> Require all granted </Directory>
